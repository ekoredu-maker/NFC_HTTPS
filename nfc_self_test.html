<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NFC 자체 진단 v1.5</title>
<style>
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Noto Sans KR,sans-serif;margin:0;background:#f8fafc;color:#0f172a}main{max-width:760px;margin:0 auto;padding:18px}.card{background:white;border:1px solid #e2e8f0;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 8px 24px rgba(15,23,42,.06)}button{border:0;border-radius:14px;padding:13px 15px;font-weight:800;margin:4px;background:#0f766e;color:white}button.secondary{background:#2563eb}button.warn{background:#b45309}.status{white-space:pre-wrap;border-radius:14px;padding:12px;margin-top:10px;background:#eef2ff}.bad{background:#fee2e2}.good{background:#dcfce7}.wait{background:#fef3c7}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;word-break:break-all}</style>
</head>
<body><main>
<h1>NFC 자체 진단 v1.5</h1>
<div class="card"><b>목적</b><br>출결 앱 문제가 아니라 휴대폰·브라우저·태그 문제인지 확인합니다. v1.5는 scan/write를 버튼 클릭 직후 바로 실행하도록 수정한 권한 안정판입니다.</div>
<div class="card">
<label>쓸 값</label><br><input id="val" value="JCLA26-001" style="width:95%;font-size:18px;padding:10px;border:1px solid #cbd5e1;border-radius:12px;margin-top:6px">
<div style="margin-top:10px"><button onclick="env()">환경점검</button><button class="secondary" onclick="readTag()">읽기 테스트</button><button class="warn" onclick="writeTag()">표준 NDEF 쓰기 테스트</button></div>
<div id="out" class="status mono">대기 중</div>
</div>
<div class="card"><b>판정</b><br>여기에서도 읽기·쓰기가 모두 실패하면 출결 앱 문제가 아니라 Web NFC 환경, 태그 종류/잠금/불량, 휴대폰 NFC 위치 또는 케이스 간섭 문제입니다. 쓰기만 실패하고 읽기가 되면 태그가 잠겼거나 쓰기 불가일 가능성이 큽니다.</div>
</main>
<script>
function out(cls,msg){const el=document.getElementById('out');el.className='status mono '+(cls||'');el.textContent=msg;}
function envText(){return [`URL=${location.href}`,`secure=${location.protocol==='https:'}`,`NDEFReader=${'NDEFReader' in window}`,`UA=${navigator.userAgent}`].join('\n')}
function ensure(){if(location.protocol!=='https:' && location.hostname!=='localhost') throw new Error('HTTPS가 아닙니다.'); if(!('NDEFReader' in window)) throw new Error('NDEFReader가 없습니다. 안드로이드 Chrome 주소창에서 여세요.');}
function env(){out('',envText())}
function norm(s){const m=String(s||'').toUpperCase().match(/JCLA26\s*[-_ ]?\s*(\d{1,3})/);return m?'JCLA26-'+m[1].padStart(3,'0'):String(s||'').trim();}
function decodeRecord(r){try{if(!r.data)return ''; const u=new Uint8Array(r.data.buffer,r.data.byteOffset,r.data.byteLength); let txt=''; try{txt=new TextDecoder(r.encoding||'utf-8').decode(u)}catch(e){txt=new TextDecoder('utf-8').decode(u)} return txt.replace(/\u0000/g,'').trim();}catch(e){return ''}}
function describe(msg){let a=[]; for(const r of msg.records){a.push(`type=${r.recordType||''}, media=${r.mediaType||''}, enc=${r.encoding||''}, data=${decodeRecord(r)||'(빈값)'}`)} return a.join('\n')||'(records 없음)'}
async function readTag(){try{ensure();out('wait','읽기 대기 중. 버튼을 누른 뒤 태그를 3초간 고정하세요.\n'+envText());const n=new NDEFReader();const c=new AbortController();let done=false;setTimeout(()=>{if(!done){done=true;try{c.abort()}catch(e){} out('bad','20초 동안 읽지 못했습니다.\n'+envText())}},20000);n.onreading=e=>{if(done)return;done=true;try{c.abort()}catch(x){} const raw=describe(e.message); out('good',`읽기 감지\nserial=${e.serialNumber||'(없음)'}\n${raw}`)};n.onreadingerror=()=>out('wait','읽기 오류. 태그 위치를 조금 옮겨 다시 대세요.');await n.scan({signal:c.signal});}catch(e){out('bad',(e.name?e.name+': ':'')+(e.message||e)+'\n'+envText())}}
async function writeTag(){try{ensure();const v=norm(document.getElementById('val').value);out('wait',`표준 NDEF 쓰기 대기 중: ${v}\n버튼을 누른 뒤 태그를 3초간 움직이지 말고 고정하세요.\n`+envText());const n=new NDEFReader();const c=new AbortController();const timer=setTimeout(()=>{try{c.abort()}catch(e){}},25000);await n.write({records:[{recordType:'text',data:v}]},{overwrite:true,signal:c.signal});clearTimeout(timer);out('good',`쓰기 완료: ${v}\n이어서 읽기 테스트로 확인하세요.`)}catch(e){out('bad',`쓰기 실패\n${e.name||''}: ${e.message||e}\n\n이 메시지가 "IO error: null"이면 앱 값 형식 문제가 아니라 태그-휴대폰 통신 또는 태그 쓰기 가능 상태 문제입니다.\n`+envText())}}
env();
</script></body></html>
