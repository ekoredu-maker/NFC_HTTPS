<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f766e" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="icon" type="image/png" href="icon-192.png" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <title>LA 학생인솔 NFC 출결관리 v0.6 공유·보고서</title>
  <style>

    :root{
      --bg:#eef4f7; --bg2:#f8fbfc; --card:#ffffff; --ink:#0f172a; --muted:#667085; --line:#d7e3ea;
      --primary:#0f766e; --primary2:#14b8a6; --primary3:#0b5e59; --danger:#dc2626; --warn:#d97706; --ok:#16a34a;
      --soft:#f0fdfa; --blue:#eff6ff; --shadow:0 18px 48px rgba(2,32,71,.10); --shadow-soft:0 8px 20px rgba(15,23,42,.06);
      --radius:22px; --radius-sm:16px;
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.48;background:
      radial-gradient(circle at top left, rgba(20,184,166,.10), transparent 28%),
      radial-gradient(circle at top right, rgba(59,130,246,.08), transparent 28%),
      linear-gradient(180deg, #f7fbfd 0%, #edf4f7 56%, #eef2f6 100%);
    }
    button,input,select,textarea{font:inherit}
    .app{max-width:1220px;margin:0 auto;padding:16px 14px 92px}
    header{position:sticky;top:0;z-index:20;padding:10px 0 8px;background:linear-gradient(180deg, rgba(247,251,253,.96), rgba(247,251,253,.82) 72%, rgba(247,251,253,0));backdrop-filter:blur(14px)}
    .top{display:flex;gap:16px;align-items:center;justify-content:space-between;padding:18px 18px 16px;border-radius:26px;background:linear-gradient(135deg,#0f766e,#0e7490 58%,#1d4ed8 120%);box-shadow:0 20px 45px rgba(13,148,136,.25);color:#fff;border:1px solid rgba(255,255,255,.16)}
    .top > div:first-child{min-width:0}.brand{display:flex;align-items:center;gap:12px;min-width:0}.brandLogo{width:54px;height:54px;border-radius:16px;box-shadow:0 10px 24px rgba(2,32,71,.22);background:#fff;flex:0 0 auto}.brandText{min-width:0}.sharePreview{width:100%;min-height:154px;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace;font-size:12px;line-height:1.55;background:#fbfdff}.scanPulse{display:inline-flex;align-items:center;gap:6px}.scanPulse:before{content:"";width:8px;height:8px;border-radius:999px;background:#22c55e;box-shadow:0 0 0 0 rgba(34,197,94,.5);animation:pulse 1.4s infinite}@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
    h1{font-size:24px;margin:0;font-weight:900;letter-spacing:-.04em;color:#fff}
    .sub{font-size:13px;color:rgba(255,255,255,.86);margin-top:6px;word-break:keep-all}
    .pill{display:inline-flex;align-items:center;gap:6px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.18);backdrop-filter:blur(10px);border-radius:999px;padding:9px 12px;font-size:12px;color:#fff;white-space:nowrap;box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
    .tabs{display:flex;gap:8px;overflow:auto;padding:10px 4px 2px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
    .tabs{margin-top:10px;background:rgba(255,255,255,.78);border:1px solid rgba(215,227,234,.8);border-radius:18px;box-shadow:var(--shadow-soft);backdrop-filter:blur(12px)}
    .tab{border:1px solid transparent;background:transparent;color:#334155;border-radius:14px;padding:10px 13px;white-space:nowrap;cursor:pointer;font-weight:750;font-size:14px;transition:.2s ease}
    .tab:hover{background:#f8fafc;color:#0f172a}
    .tab.active{background:linear-gradient(135deg,var(--primary),#0d9488);box-shadow:0 8px 18px rgba(15,118,110,.22);color:#fff}
    .grid{display:grid;gap:14px}.grid.cols4{grid-template-columns:repeat(4,1fr)}.grid.cols3{grid-template-columns:repeat(3,1fr)}.grid.cols2{grid-template-columns:repeat(2,1fr)}
    .card{background:linear-gradient(180deg,rgba(255,255,255,.98),rgba(255,255,255,.94));border:1px solid rgba(215,227,234,.92);box-shadow:var(--shadow);border-radius:var(--radius);padding:16px;margin-top:14px}
    .card h2{font-size:18px;margin:0 0 12px;font-weight:900;letter-spacing:-.03em;display:flex;align-items:center;gap:8px}
    .card h2:before{content:"";width:6px;height:20px;border-radius:99px;background:linear-gradient(180deg,var(--primary2),var(--primary))}
    .card h3{font-size:15px;margin:14px 0 8px;font-weight:850;color:#1f2937}
    .metric{background:linear-gradient(180deg,#fff,#f9fcfd);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow-soft);position:relative;overflow:hidden}
    .metric:after{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:linear-gradient(90deg,var(--primary2),var(--primary))}
    .metric.ok:after{background:linear-gradient(90deg,#22c55e,#16a34a)}
    .metric.warn:after{background:linear-gradient(90deg,#fbbf24,#d97706)}
    .metric.danger:after{background:linear-gradient(90deg,#f97316,#dc2626)}
    .metric .label{font-size:12px;color:var(--muted);font-weight:700}
    .metric .num{font-size:31px;font-weight:950;margin-top:6px;letter-spacing:-.06em;color:#0f172a}
    .metric.ok .num{color:var(--ok)}.metric.warn .num{color:var(--warn)}.metric.danger .num{color:var(--danger)}
    .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.between{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.grow{flex:1}.hidden{display:none!important}
    label{display:block;font-size:12px;color:#475467;font-weight:800;margin:8px 0 5px}
    input,select,textarea{width:100%;border:1px solid var(--line);background:#fff;border-radius:14px;padding:11px 12px;outline:none;box-shadow:inset 0 1px 2px rgba(15,23,42,.02)}textarea{min-height:82px;resize:vertical}
    input:focus,select:focus,textarea:focus{border-color:var(--primary2);box-shadow:0 0 0 4px rgba(20,184,166,.12)}
    button{border:0;border-radius:14px;background:#e5e7eb;color:#111827;padding:10px 13px;cursor:pointer;font-weight:800;transition:.18s transform,.18s box-shadow,.18s opacity,.18s background}.btn:hover,button:hover{transform:translateY(-1px)}button:disabled{opacity:.55;cursor:not-allowed;transform:none;box-shadow:none!important}
    .primary{background:linear-gradient(135deg,var(--primary),#0d9488);color:#fff;box-shadow:0 8px 18px rgba(15,118,110,.24)}
    .secondary{background:linear-gradient(135deg,#0f766e,#155e75);color:#fff;box-shadow:0 8px 18px rgba(8,47,73,.18)}
    .danger{background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff;box-shadow:0 8px 18px rgba(220,38,38,.18)}
    .warn{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#111827;box-shadow:0 8px 18px rgba(245,158,11,.18)}
    .ghost{background:#fff;border:1px solid var(--line);color:#334155;box-shadow:var(--shadow-soft)}
    .soft{background:var(--soft);color:#115e59;border:1px solid #99f6e4;box-shadow:var(--shadow-soft)}
    .small{font-size:12px;padding:8px 10px;border-radius:12px}.wide{width:100%}
    table{width:100%;border-collapse:separate;border-spacing:0;background:#fff;border-radius:16px;overflow:hidden}th,td{border-bottom:1px solid #edf2f7;padding:10px 9px;text-align:left;font-size:13px;vertical-align:top}th{background:#f8fafc;color:#334155;font-weight:850;white-space:nowrap;position:sticky;top:0;z-index:1}tr:last-child td{border-bottom:0}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:16px;background:#fff}.nowrap{white-space:nowrap}.muted{color:var(--muted)}.note{font-size:12px;color:var(--muted);line-height:1.45}
    .status{border-radius:16px;padding:11px 13px;background:#f9fafb;border:1px solid var(--line);font-size:13px;line-height:1.5;box-shadow:var(--shadow-soft)}.status.good{background:#f0fdf4;border-color:#bbf7d0;color:#14532d}.status.bad{background:#fef2f2;border-color:#fecaca;color:#7f1d1d}.status.wait{background:#fffbeb;border-color:#fde68a;color:#78350f}.status.info{background:#eff6ff;border-color:#bfdbfe;color:#1e3a8a}
    .list{display:grid;gap:10px}.person{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--line);background:linear-gradient(180deg,#fff,#fbfdff);border-radius:16px;padding:12px;box-shadow:var(--shadow-soft)}.person strong{font-size:14px}.tag{display:inline-flex;align-items:center;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:850;background:#f3f4f6;color:#374151}.tag.ok{background:#dcfce7;color:#166534}.tag.danger{background:#fee2e2;color:#991b1b}.tag.warn{background:#fef3c7;color:#92400e}.tag.primary{background:#ccfbf1;color:#115e59}
    .footerbar{position:fixed;left:0;right:0;bottom:0;background:transparent;z-index:30;padding:0 12px 10px}
    .footerinner{max-width:1220px;margin:0 auto;padding:10px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;background:rgba(255,255,255,.88);border:1px solid rgba(215,227,234,.9);box-shadow:0 18px 40px rgba(2,32,71,.12);backdrop-filter:blur(14px);border-radius:18px}.footerinner .mini{font-size:12px;color:#475467;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
    .scanner{border:2px dashed #67e8f9;background:linear-gradient(180deg,#f0fdfa,#ecfeff);border-radius:20px;padding:18px;text-align:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}.bigread{font-size:22px;font-weight:950;color:#0f766e;margin:8px 0;word-break:break-all}.dangerText{color:var(--danger);font-weight:850}.okText{color:var(--ok);font-weight:850}.warnText{color:var(--warn);font-weight:850}
    .printArea{background:#fff;padding:18px;border-radius:10px}.printTitle{text-align:center;font-size:22px;font-weight:900;margin:6px 0 16px}.printMeta{font-size:13px;margin-bottom:12px}.signature{display:flex;justify-content:space-around;margin-top:36px;font-size:14px}.sigline{display:inline-block;width:180px;border-bottom:1px solid #111;margin-left:8px}
    .modal{position:fixed;inset:0;background:rgba(15,23,42,.5);display:flex;align-items:flex-end;justify-content:center;padding:12px;z-index:80;backdrop-filter:blur(3px)}.modalBox{width:min(720px,100%);max-height:88vh;overflow:auto;background:linear-gradient(180deg,#fff,#fbfdff);border-radius:24px;padding:18px;box-shadow:0 25px 80px rgba(0,0,0,.25);border:1px solid rgba(215,227,234,.9)}
    .printOnly{display:none}
    .screenHeroCard{background:linear-gradient(135deg,rgba(255,255,255,.88),rgba(255,255,255,.76));border:1px solid rgba(255,255,255,.5);padding:12px 14px;border-radius:18px;box-shadow:var(--shadow-soft)}
    @media(max-width:850px){
      .grid.cols4,.grid.cols3,.grid.cols2{grid-template-columns:1fr}
      .app{padding-left:10px;padding-right:10px}
      h1{font-size:19px}
      .metric .num{font-size:26px}
      th,td{font-size:12px;padding:8px 6px}
      .hideMobile{display:none}
      .top{align-items:flex-start;padding:16px 14px;flex-direction:column}.brandLogo{width:46px;height:46px;border-radius:14px}
      .pill{font-size:11px;width:100%;justify-content:center}
      .tabs{padding:8px 4px}
      .tab{padding:10px 11px;font-size:13px}
      .footerbar{padding:0 8px 8px}
      .footerinner{padding:10px 12px}
      .card{padding:14px}
    }
    @media print{
      body{background:#fff}.app header,.tabs,.footerbar,.noPrint,button,.modal{display:none!important}.app{padding:0;max-width:none}.card{box-shadow:none;border:0;margin:0;padding:0}.printOnly{display:block!important}.screenOnly{display:none!important}table{page-break-inside:auto}tr{page-break-inside:avoid;page-break-after:auto}th{background:#f3f4f6!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}.printArea{padding:0}
    }

  </style>
</head>

<script>
(() => {
  'use strict';

  const KEY = 'jcla26_nfc_attendance_v01';
  const defaultCheckpoints = [
    {id: uid(), date:'7.26.(일)', name:'제천교육지원청 집결', note:'출발 전 여권·명찰 확인'},
    {id: uid(), date:'7.26.(일)', name:'인천공항 도착', note:'수하물 위탁 전'},
    {id: uid(), date:'7.26.(일)', name:'탑승구 집결', note:'탑승 직전'},
    {id: uid(), date:'7.26.(일)', name:'LA공항 수하물 수령 후', note:'입국 후 전체 확인'},
    {id: uid(), date:'7.26.(일)', name:'호텔 도착', note:'객실 배정 전'},

    {id: uid(), date:'7.27.(월)', name:'점심 후 버스 탑승', note:''},
    {id: uid(), date:'7.27.(월)', name:'호텔 복귀', note:'취침 점검 전'},
    {id: uid(), date:'7.28.(화)', name:'NYFA 이동 전', note:''},
    {id: uid(), date:'7.29.(수)', name:'그로브몰·파머스마켓 자유시간 복귀', note:'자유시간 후 핵심 체크'},
    {id: uid(), date:'7.30.(목)', name:'호텔 이동/도착 확인', note:'숙소 변경 시 짐 확인'},
    {id: uid(), date:'7.31.(금)', name:'UCLA 이동 전', note:''},
    {id: uid(), date:'8.1.(토)', name:'유니버설 스튜디오 입장 전', note:''},
    {id: uid(), date:'8.1.(토)', name:'유니버설 스튜디오 최종 집결', note:'자유 이동 후 핵심 체크'},
    {id: uid(), date:'8.2.(일)', name:'LA공항 이동 전', note:'여권·수하물 확인'},
    {id: uid(), date:'8.3.(월)', name:'인천공항 도착', note:''},
    {id: uid(), date:'8.3.(월)', name:'제천교육지원청 도착 및 해산', note:'보호자 인계 확인'}
  ];

  const sampleStudents = [
    {id: uid(), seq:'1', tagId:'JCLA26-001', name:'김○○', school:'○○초', grade:'초6', gender:'남', group:'1조', leader:'강창원', note:'멀미'},
    {id: uid(), seq:'2', tagId:'JCLA26-002', name:'이○○', school:'○○중', grade:'중1', gender:'여', group:'1조', leader:'강창원', note:''},
    {id: uid(), seq:'3', tagId:'JCLA26-003', name:'박○○', school:'○○고', grade:'고1', gender:'남', group:'2조', leader:'강창원', note:'알레르기'}
  ];

  let state = loadState();
  let activeTab = 'dashboard';
  let activeNfcAbort = null;
  let activeNfcReader = null;
  let scanUi = {active:false, last:'대기 중', type:'info', message:'NFC 스캔 시작을 누르세요.'};
  let wakeLock = null;
  let autoSaveTimer = null;

  const tabs = [
    ['dashboard','대시보드'], ['students','학생명단'], ['write','NFC 쓰기'], ['check','출결체크'], ['records','출결기록'], ['print','출력·다운로드'], ['ops','실전점검'], ['settings','설정']
  ];

  window.addEventListener('load', () => {
    renderTabs();
    updateEnv();
    renderAll();
  });

  window.addEventListener('beforeunload', () => saveState());

  function uid(){ return 'id_' + Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4); }
  function nowISO(){ return new Date().toISOString(); }
  function pad(n){ return String(n).padStart(2,'0'); }
  function formatDateTime(iso){ const d = new Date(iso); if(isNaN(d)) return iso||''; return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; }
  function formatTime(iso){ const d = new Date(iso); if(isNaN(d)) return ''; return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; }
  function escapeHtml(s){ return String(s??'').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])); }
  function norm(s){ return String(s??'').trim(); }
  function normalizeTag(s){ return norm(s).replace(/\s+/g,'').toUpperCase(); }
  function studentSeq(st, idx){ return norm(st?.seq) || (Number.isFinite(idx) ? String(idx+1) : ''); }
  function gradeText(g){ return norm(g); }
  function coalesce(...vals){ for(const v of vals){ const n=norm(v); if(n) return n; } return ''; }

  function loadState(){
    try{
      const raw = localStorage.getItem(KEY);
      if(raw){
        const obj = JSON.parse(raw);
        return {
          students: Array.isArray(obj.students)?obj.students:[],
          checkpoints: Array.isArray(obj.checkpoints)?obj.checkpoints:defaultCheckpoints,
          records: Array.isArray(obj.records)?obj.records:[],
          settings: Object.assign(defaultSettings(), obj.settings || {}),
          ops: Object.assign(defaultOps(), obj.ops || {})
        };
      }
    }catch(e){ console.warn(e); }
    return {students: [], checkpoints: defaultCheckpoints, records: [], settings: defaultSettings(), ops: defaultOps()};
  }
  function defaultSettings(){ return { prefix:'JCLA26', nextNumber:1, currentCheckpointId:null, useSound:true, useVibration:true, maskNames:false }; }
  function defaultOps(){ return { checklist:{}, memo:'', lastRehearsal:'' }; }
  function saveState(){
    localStorage.setItem(KEY, JSON.stringify(state));
    const t = formatDateTime(nowISO());
    const el = document.getElementById('saveInfo');
    if(el) el.textContent = `마지막 저장: ${t} · 학생 ${state.students.length}명 · 기록 ${state.records.length}건`;
  }
  function scheduleSave(){
    clearTimeout(autoSaveTimer);
    autoSaveTimer = setTimeout(() => { saveState(); }, 250);
  }
  window.quickSave = () => { saveState(); toast('저장했습니다.'); };

  function renderTabs(){
    document.getElementById('tabs').innerHTML = tabs.map(([id,label]) => `<button class="tab ${id===activeTab?'active':''}" onclick="switchTab('${id}')">${label}</button>`).join('');
  }
  window.switchTab = (id) => {
    stopNfc();
    activeTab = id;
    document.querySelectorAll('.view').forEach(v => v.classList.add('hidden'));
    document.getElementById(`view-${id}`).classList.remove('hidden');
    renderTabs();
    renderAll();
    window.scrollTo({top:0, behavior:'smooth'});
  };

  function renderAll(){
    if(!state.ops) state.ops = defaultOps(); renderDashboard(); renderStudents(); renderWrite(); renderCheck(); renderRecords(); renderPrint(); renderOps(); renderSettings(); saveState();
  }

  function updateEnv(){
    const isSecure = location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1';
    const hasNfc = 'NDEFReader' in window;
    const p = document.getElementById('envPill');
    if(hasNfc && isSecure){ p.innerHTML = '✅ NFC 사용 가능 환경'; p.style.borderColor='#99f6e4'; p.style.background='#ecfeff'; }
    else if(hasNfc && !isSecure){ p.innerHTML = '⚠️ NFC는 HTTPS에서 사용'; p.style.borderColor='#fde68a'; p.style.background='#fffbeb'; }
    else { p.innerHTML = '🧪 NFC 미지원/테스트 모드'; p.style.borderColor='#fecaca'; p.style.background='#fef2f2'; }
  }

  function currentCheckpoint(){
    return state.checkpoints.find(c => c.id === state.settings.currentCheckpointId) || state.checkpoints[0] || null;
  }
  function recordsForCheckpoint(cpId){ return state.records.filter(r => r.checkpointId === cpId); }
  function checkedTagSet(cpId){ return new Set(recordsForCheckpoint(cpId).map(r => normalizeTag(r.tagId))); }
  function checkedStudentIds(cpId){ return new Set(recordsForCheckpoint(cpId).map(r => r.studentId).filter(Boolean)); }
  function displayName(s){ return state.settings.maskNames ? maskName(s.name) : s.name; }
  function maskName(name){ const n = norm(name); if(n.length<=1) return n; if(n.includes('○')) return n; return n[0] + '○'.repeat(Math.max(1,n.length-1)); }
  function groups(){ return [...new Set(state.students.map(s => norm(s.group)||'미지정'))].sort((a,b)=>a.localeCompare(b,'ko')); }

  function summary(cpId){
    const sidSet = checkedStudentIds(cpId);
    const total = state.students.length;
    const done = state.students.filter(s => sidSet.has(s.id)).length;
    const manual = recordsForCheckpoint(cpId).filter(r => r.method === '수동').length;
    return {total, done, missing: Math.max(0,total-done), manual};
  }

  };
  window.saveStudentModal = (id='') => {
    const data = {
      seq: norm(document.getElementById('m_seq').value),
      tagId: normalizeTag(document.getElementById('m_tagId').value),
      name: norm(document.getElementById('m_name').value),
      school: norm(document.getElementById('m_school').value),
      grade: norm(document.getElementById('m_grade').value),
      gender: norm(document.getElementById('m_gender').value),
      group: norm(document.getElementById('m_group').value),
      leader: norm(document.getElementById('m_leader').value),
      note: norm(document.getElementById('m_note').value)
    };
    if(!data.name){ alert('성명을 입력하세요.'); return; }
    if(!data.tagId) data.tagId = nextTagId();
    const dup = state.students.find(s => normalizeTag(s.tagId)===data.tagId && s.id!==id);
    if(dup && !confirm(`같은 NFC ID를 가진 학생이 있습니다: ${dup.name}\n그래도 저장할까요?`)) return;
    if(id){ Object.assign(state.students.find(s=>s.id===id), data); }
    else { state.students.push(Object.assign({id:uid()}, data)); }
    hideModal(); scheduleSave(); renderAll();
  };
  window.deleteStudent = (id) => {
    const st = state.students.find(s=>s.id===id); if(!st) return;
    if(confirm(`${st.name} 학생을 삭제할까요?\n기존 출결 기록은 유지됩니다.`)){ state.students = state.students.filter(s=>s.id!==id); scheduleSave(); renderAll(); }
  };
  window.clearStudents = () => { if(confirm('학생명단을 모두 삭제할까요? 출결 기록은 유지됩니다.')){ state.students=[]; scheduleSave(); renderAll(); } };
  window.loadSampleStudents = () => { if(state.students.length && !confirm('기존 명단 뒤에 샘플을 추가할까요?')) return; state.students.push(...sampleStudents.map(s=>Object.assign({},s,{id:uid()}))); scheduleSave(); renderAll(); };

  window.addQuickStudents = () => {
    const text = document.getElementById('quickStudents').value.trim(); if(!text) return;
    const lines = text.split(/\n+/).map(x=>x.trim()).filter(Boolean);
    lines.forEach(line=>{
      const cols = parseDelimitedLine(line);
      const [seq,school,grade,name,gender,note] = cols;
      if(norm(name)) state.students.push({id:uid(), seq:norm(seq), tagId:nextTagId(), name:norm(name), school:norm(school), grade:norm(grade), gender:norm(gender), group:'', leader:'', note:norm(note)});
    });
    scheduleSave(); renderAll(); toast(`${lines.length}명 추가했습니다.`);
  };

  function parseDelimitedLine(line){
    // Simple comma/tab separated input for quick entry only. Excel upload remains the primary method.
    const sep = line.includes('\t') ? '\t' : ',';
    return String(line).split(sep).map(x=>x.trim());
  }

  window.assignTags = () => {
    const prefix = norm(prompt('태그 접두어를 입력하세요.', state.settings.prefix || 'JCLA26')) || 'JCLA26';
    let start = parseInt(prompt('시작 번호를 입력하세요.', '1'), 10); if(!Number.isFinite(start)) start=1;
    state.settings.prefix = prefix;
    state.students.forEach((s,i)=>{ s.tagId = `${prefix}-${String(start+i).padStart(3,'0')}`; });
    state.settings.nextNumber = start + state.students.length;
    scheduleSave(); renderAll();
  };

  function nextTagId(){
    let n = Number(state.settings.nextNumber || 1);
    const prefix = state.settings.prefix || 'JCLA26';
    let candidate = `${prefix}-${String(n).padStart(3,'0')}`;
    const used = new Set(state.students.map(s=>normalizeTag(s.tagId)));
    while(used.has(normalizeTag(candidate))){ n++; candidate = `${prefix}-${String(n).padStart(3,'0')}`; }
    state.settings.nextNumber = n+1;
    return candidate;
  }

  async function ensureNfc(){
    const isSecure = location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1';
    if(!('NDEFReader' in window)) throw new Error('이 브라우저는 Web NFC를 지원하지 않습니다. 안드로이드 Chrome에서 테스트하세요.');
    if(!isSecure) throw new Error('NFC 기능은 HTTPS 또는 localhost 환경에서만 사용할 수 있습니다.');
  }

  window.writeNfcTag = async () => {
    const value = normalizeTag(document.getElementById('writeValue').value);
    if(!value){ alert('기록할 NFC ID가 없습니다.'); return; }
    setWriteStatus('wait','태그를 스마트폰 뒷면에 가까이 대세요. 쓰기를 시도합니다...');
    try{
      await ensureNfc();
      const ndef = new NDEFReader();
      await ndef.write({ records: [{ recordType: 'text', data: value, lang: 'ko' }] });
      document.getElementById('writeReadResult').textContent = value;
      setWriteStatus('good',`쓰기 완료: ${value}`);
      beep('ok'); vibrate([80]);
    }catch(err){
      setWriteStatus('bad', err.message || String(err));
      beep('bad'); vibrate([80,60,80]);
    }
  };

  window.startAttendanceScan = async () => {
    const cp = currentCheckpoint(); if(!cp){ alert('체크포인트가 없습니다.'); return; }
    stopNfc(false);
    setScanStatus('wait','NFC 스캔 중입니다. 학생 명찰을 스마트폰 뒷면에 대세요.');
    try{
      await ensureNfc();
      const ndef = new NDEFReader();
      activeNfcReader = ndef;
      activeNfcAbort = new AbortController();
      scanUi.active = true;
      await ndef.scan({ signal: activeNfcAbort.signal });
      ndef.onreading = (event) => {
        const tag = readTextFromMessage(event.message);
        processScan(tag, 'NFC');
      };
      setScanStatus('good','자동 스캔 준비 완료. 학생 명찰을 한 명씩 태그하세요.');
      ndef.onreadingerror = () => setScanStatus('bad','태그를 읽지 못했습니다. 다시 대세요.');
    }catch(err){ setScanStatus('bad', err.message || String(err)); beep('bad'); }
  };

  function stopNfc(show=true){
    if(activeNfcAbort){ try{ activeNfcAbort.abort(); }catch(e){} activeNfcAbort=null; }
    activeNfcReader = null;
    scanUi.active = false;
    if(show){ setScanStatus('info','스캔을 중지했습니다.'); }
  }
  window.stopNfc = stopNfc;

  async function scanNfcOnce(cb){
    await ensureNfc();
    const ndef = new NDEFReader();
    const controller = new AbortController();
    await ndef.scan({ signal: controller.signal });
    ndef.onreading = (event) => {
      const tag = readTextFromMessage(event.message);
      controller.abort();
      cb(tag);
    };
    setTimeout(()=>{ try{controller.abort();}catch(e){} }, 20000);
  }

  function readTextFromMessage(message){
    for(const record of message.records){
      if(record.recordType === 'text'){
        const dec = new TextDecoder(record.encoding || 'utf-8');
        return normalizeTag(dec.decode(record.data));
      }
      if(record.recordType === 'url'){
        const dec = new TextDecoder('utf-8');
        return normalizeTag(dec.decode(record.data));
      }
    }
    return '';
  }

  function processScan(rawTag, method='NFC'){
    const tag = normalizeTag(rawTag);
    const cp = currentCheckpoint();
    if(!tag){ setScanStatus('bad','태그 값이 비어 있습니다.'); beep('bad'); return; }
    const st = state.students.find(s => normalizeTag(s.tagId) === tag);
    if(!st){
      setLastScan(tag);
      setScanStatus('bad',`미등록 태그입니다: ${tag}`);
      beep('bad'); vibrate([80,60,80]);
      return;
    }
    const already = recordsForCheckpoint(cp.id).find(r => r.studentId === st.id);
    if(already){
      setLastScan(`${displayName(st)} · ${st.group||''}`);
      setScanStatus('wait',`이미 체크됨: ${displayName(st)} (${formatTime(already.time)})`);
      beep('warn'); vibrate([40,40]);
      return;
    }
    addRecord(st, cp, method, '');
    setLastScan(`${displayName(st)} · ${st.group||''}`);
    setScanStatus('good',`체크 완료: ${displayName(st)} · ${formatTime(nowISO())}`);
    beep('ok'); vibrate([70]);
    scheduleSave(); renderDashboard(); renderCheck();
  }

    ];
    const score = checks.filter(x=>x.ok).length;
    return {checks, score, total:checks.length};
  }

  window.copyMissingList = async () => {
    const cp=currentCheckpoint(); if(!cp){ alert('체크포인트가 없습니다.'); return; }
    const sidSet = checkedStudentIds(cp.id);
    const missing = state.students.filter(s=>!sidSet.has(s.id));
    const text = `[미체크] ${cp.date} ${cp.name}\n` + (missing.length ? missing.map((s,i)=>`${i+1}. ${s.name} / ${s.school} ${s.grade} / ${s.group||'미지정'} / ${s.tagId}`).join('\n') : '미체크 없음');

  function attendanceRate(done,total){ return total ? Math.round(done/total*100) : 0; }
  function studentBrief(s){ return `${displayName(s)} / ${s.school||''} ${s.grade||''} / ${s.group||'미지정'}`.replace(/\s+/g,' ').trim(); }
  function buildAttendanceShareMessage(cp=currentCheckpoint()){
    if(!cp) return '체크포인트가 없습니다.';
    const sm = summary(cp.id);
    const sidSet = checkedStudentIds(cp.id);
    const missing = state.students.filter(s=>!sidSet.has(s.id));
    const manual = recordsForCheckpoint(cp.id).filter(r=>r.method==='수동');
    const lines = [];
    lines.push('[LA 학생인솔 출결상황]');
    lines.push(`체크포인트: ${cp.date} ${cp.name}`);
    lines.push(`기준시각: ${formatDateTime(nowISO())}`);
    lines.push(`전체 ${sm.total}명 / 확인 ${sm.done}명 / 미체크 ${sm.missing}명 / 수동확인 ${sm.manual}명 / 완료율 ${attendanceRate(sm.done, sm.total)}%`);
    lines.push('');
    if(missing.length){
      lines.push('미체크 학생');
      missing.forEach((s,i)=>lines.push(`${i+1}. ${studentBrief(s)} / ${s.tagId}`));
    } else {
      lines.push('미체크 학생: 없음');
    }
    if(manual.length){
      lines.push('');
      lines.push('수동확인');
      manual.forEach((r,i)=>lines.push(`${i+1}. ${state.settings.maskNames?maskName(r.name):r.name} / ${r.group||''} / ${r.note||'인솔자 확인'}`));
    }
    lines.push('');
    lines.push('※ 출결 공유용 요약입니다. 건강정보 등 민감정보는 포함하지 않습니다.');
    return lines.join('\n');
  }
  async function shareTextPayload(title, text){
    if(navigator.share){

      toast('공유창을 열었습니다.');

      await navigator.clipboard.writeText(text);
      toast('공유 문구를 복사했습니다. 카톡방에 붙여넣으세요.');

  }

    try{ await shareTextPayload('LA 학생인솔 출결상황', text); }
    catch(e){ try{ await navigator.clipboard.writeText(text); toast('공유가 취소되어 문구를 복사했습니다.'); }catch(_){ prompt('공유할 문구입니다.', text); } }

  function download(filename, content, mime='text/plain;charset=utf-8'){
    const blob = new Blob([content], {type:mime}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=filename; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
  }
  function ensureXlsx(){
    if(typeof XLSX === 'undefined'){
      alert('엑셀 기능을 사용하려면 XLSX 라이브러리가 로드되어야 합니다.\n\n현재 파일을 인터넷 연결 상태에서 열거나, HTTPS 배포 페이지에서 다시 접속해 주세요.');
      return false;
    }
    return true;
  }
  const uploadHeaders = ['연번','학교','학년','이름','성별','비고'];
  const studentHeaders = ['연번','학교','학년','이름','성별','비고','NFC ID','조','담당 인솔자'];
  const recordHeaders = ['일시','체크포인트일자','체크포인트','연번','NFC ID','학교','학년','이름','성별','조','담당','확인방식','비고'];
  function sheetWidths(headers){ return headers.map(h=>({wch: Math.max(12, String(h).length*2)})); }
  function makeWorkbook(sheetName, rows){
    const wb = XLSX.utils.book_new();
    const ws = XLSX.utils.aoa_to_sheet(rows);
    ws['!cols'] = sheetWidths(rows[0] || []);
    XLSX.utils.book_append_sheet(wb, ws, sheetName);
    return wb;
  }
  function writeWorkbook(filename, sheetName, rows){
    if(!ensureXlsx()) return;
    XLSX.writeFile(makeWorkbook(sheetName, rows), filename, {bookType:'xlsx'});
  }
  function studentRows(){
    return [studentHeaders].concat(state.students.map((s,i)=>[studentSeq(s,i),s.school,s.grade,s.name,s.gender||'',s.note||'',s.tagId||'',s.group||'',s.leader||'']));
  }
  function recordRows(){
    return [recordHeaders].concat(state.records.map((r,i)=>[formatDateTime(r.time),r.checkpointDate,r.checkpointName,r.seq||'',r.tagId,r.school,r.grade,r.name,r.gender||'',r.group,r.leader,r.method,r.note]));
  }

  function checkpointSummaryRows(){
    return [['일자','체크포인트','전체','체크','미체크','수동확인','완료율']].concat(state.checkpoints.map(c=>{const sm=summary(c.id); return [c.date,c.name,sm.total,sm.done,sm.missing,sm.manual,`${attendanceRate(sm.done, sm.total)}%`];}));
  }
  function groupSummaryRows(cp=currentCheckpoint()){
    if(!cp) return [['조','전체','체크','미체크','완료율']];
    const sidSet = checkedStudentIds(cp.id);
    return [['조','전체','체크','미체크','완료율']].concat(groups().map(g=>{
      const list = state.students.filter(st => (norm(st.group)||'미지정')===g);
      const done = list.filter(st=>sidSet.has(st.id)).length;
      return [g, list.length, done, list.length-done, `${attendanceRate(done, list.length)}%`];
    }));
  }
  function missingRows(cp=currentCheckpoint()){
    if(!cp) return [['연번','NFC ID','학교','학년','이름','성별','조','담당','비고']];
    const sidSet = checkedStudentIds(cp.id);
    const missing = state.students.filter(s=>!sidSet.has(s.id));
    return [['연번','NFC ID','학교','학년','이름','성별','조','담당','비고']].concat(missing.map((s,i)=>[studentSeq(s,i),s.tagId,s.school,s.grade,s.name,s.gender||'',s.group||'',s.leader||'',s.note||'']));

  function studentSummaryRows(){
    const cps = state.checkpoints;
    return [['연번','NFC ID','학교','학년','이름','성별','조','확인 체크포인트 수','누락 체크포인트 수']].concat(state.students.map((s,i)=>{
      const done = cps.filter(c=>recordsForCheckpoint(c.id).some(r=>r.studentId===s.id)).length;
      return [studentSeq(s,i),s.tagId,s.school,s.grade,s.name,s.gender||'',s.group||'',done,Math.max(0,cps.length-done)];
    }));
  }
  function addSheetToWorkbook(wb, name, rows){

  }

  window.downloadStudentTemplateExcel = () => {
    const rows = [uploadHeaders,
      [1,'○○초','초6','김○○','남','멀미'],
      [2,'○○중','중1','이○○','여',''],
      [3,'○○고','고1','박○○','남','알레르기']
    ];
    writeWorkbook(`JCLA26_국외프로그램_대상자_업로드양식_${dateFile()}.xlsx`, '학생명단', rows);
  };
  window.downloadBackupJson = () => { download(`JCLA26_NFC출결_백업_${dateFile()}.json`, JSON.stringify(state,null,2), 'application/json;charset=utf-8'); };
  window.restoreBackupJson = async (ev) => {
    const file = ev.target.files?.[0]; if(!file) return;
    try{
      const text = await file.text(); const obj = JSON.parse(text);
      if(!Array.isArray(obj.students) || !Array.isArray(obj.checkpoints) || !Array.isArray(obj.records)) throw new Error('백업 파일 형식이 맞지 않습니다.');
      if(confirm('현재 데이터를 백업 파일로 교체할까요?')){ state = {students:obj.students, checkpoints:obj.checkpoints, records:obj.records, settings:Object.assign(defaultSettings(), obj.settings||{}), ops:Object.assign(defaultOps(), obj.ops||{})}; scheduleSave(); renderAll(); }
    }catch(e){ alert('복원 실패: ' + e.message); }
    ev.target.value='';
  };
  function dateFile(){ const d=new Date(); return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}`; }

  window.importStudentExcel = async (ev) => {
    const file = ev.target.files?.[0]; if(!file) return;
    if(!ensureXlsx()){ ev.target.value=''; return; }
    try{
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, {type:'array'});
      const sheetName = wb.SheetNames.includes('학생명단') ? '학생명단' : wb.SheetNames[0];
      const ws = wb.Sheets[sheetName];
      const rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:''}).filter(r => r.some(c => norm(c)));
      if(!rows.length) throw new Error('엑셀 시트에 데이터가 없습니다.');
      const header = rows[0].map(h=>norm(h).toLowerCase().replace(/\s/g,''));
      const headerNames = ['연번','학교','학년','이름','성별','비고','성명','nfcid','nfc번호','태그','조','담당','담당인솔자'];
      const hasHeader = header.some(h=>headerNames.includes(h));
      const dataRows = hasHeader ? rows.slice(1) : rows;
      if(hasHeader){
        const required = ['학교','학년','이름'];
        const missing = required.filter(req => !header.includes(req) && !(req==='이름' && header.includes('성명')));
        if(missing.length) throw new Error(`필수 헤더가 없습니다: ${missing.join(', ')}`);
      }
      let added = 0, updated = 0, skipped = 0;
      dataRows.forEach((cols, idx)=>{
        let seq='', school='', grade='', name='', gender='', note='', tagId='', group='', leader='';
        if(hasHeader){
          const get = (names) => { const idx = header.findIndex(h=>names.includes(h)); return idx>=0 ? cols[idx] : ''; };
          seq = get(['연번','no','번호']);
          school = get(['학교','school']);
          grade = get(['학년','grade']);
          name = get(['이름','성명','name']);
          gender = get(['성별','gender','sex']);
          note = get(['비고','note','특이사항']);
          tagId = get(['nfcid','nfc번호','태그','태그id','nfc']);
          group = get(['조','group']);
          leader = get(['담당인솔자','담당','인솔자','leader']);
        } else {
          [seq, school, grade, name, gender, note] = cols;
        }
        if(!norm(name)){ skipped++; return; }
        const row = { 
          seq:norm(seq) || String(state.students.length + added + 1),
          tagId:normalizeTag(tagId)||nextTagId(),
          name:norm(name),
          school:norm(school),
          grade:norm(grade),
          gender:norm(gender),
          group:norm(group),
          leader:norm(leader),
          note:norm(note)
        };
        const existing = state.students.find(s => (row.tagId && normalizeTag(s.tagId) === row.tagId) || (norm(s.name)===row.name && norm(s.school)===row.school && norm(s.grade)===row.grade));
        if(existing){ Object.assign(existing, row); updated++; }
        else { state.students.push(Object.assign({id:uid()}, row)); added++; }
      });
      scheduleSave(); renderAll(); toast(`엑셀 명단 불러오기 완료: 추가 ${added}명, 갱신 ${updated}명, 제외 ${skipped}행`);
    }catch(e){ alert('엑셀 불러오기 실패: '+e.message); }
    ev.target.value='';
  };

  function showModal(html){ document.getElementById('modalBox').innerHTML=html; document.getElementById('modal').classList.remove('hidden'); }
  window.hideModal = () => document.getElementById('modal').classList.add('hidden');
  window.closeModal = (ev) => { if(ev.target.id==='modal') hideModal(); };

  function toast(msg){
    const d=document.createElement('div'); d.textContent=msg; d.style.cssText='position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:linear-gradient(135deg,#111827,#0f766e);color:#fff;padding:11px 16px;border-radius:999px;z-index:100;font-weight:900;font-size:13px;box-shadow:0 16px 34px rgba(2,32,71,.22);border:1px solid rgba(255,255,255,.12)'; document.body.appendChild(d); setTimeout(()=>d.remove(),1800);
  }
  function vibrate(pattern){ if(state.settings.useVibration && navigator.vibrate) navigator.vibrate(pattern); }
  function beep(kind='ok'){
    if(!state.settings.useSound) return;
    try{
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator(); const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.frequency.value = kind==='ok' ? 880 : kind==='warn' ? 520 : 220;
      gain.gain.value = 0.045; osc.start();
      setTimeout(()=>{ osc.stop(); ctx.close(); }, kind==='ok'?90:150);
    }catch(e){}
  }

  // expose a few functions intentionally
  window.processScan = processScan;
})();
</script>
